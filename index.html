<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Semantic Map LBS Prototype</title>
    <style>
        * {
            touch-action: manipulation;
        }
        html, body {
            overflow: hidden;
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css?v=grammar-63">
</head>
<body>
    <div id="map"></div>
    <div id="toast-layer" aria-live="polite" aria-atomic="true"></div>

    <div id="level-onboarding-layer" class="hidden">
        <div class="level-onboarding-panel">
            <p class="level-onboarding-kicker" data-zh="开始前" data-ja="開始前">开始前</p>
            <h1 data-zh="选择你的日语等级" data-ja="日本語レベルを選択">选择你的日语等级</h1>
            <p class="level-onboarding-copy" data-zh="地图任务会按照你选择的等级生成文型。" data-ja="選んだレベルに合わせて地図タスクが生成されます。">地图任务会按照你选择的等级生成文型。</p>
            <div class="level-choice-list">
                <button class="level-choice-btn" type="button" data-level-choice="N5">
                    <span class="level-choice-main" data-zh="新手" data-ja="初心者">新手</span>
                    <span class="level-choice-sub">JLPT N5-N4</span>
                </button>
                <button class="level-choice-btn" type="button" data-level-choice="N3">
                    <span class="level-choice-main" data-zh="进阶" data-ja="中級">进阶</span>
                    <span class="level-choice-sub">JLPT N3-N2</span>
                </button>
                <button class="level-choice-btn" type="button" data-level-choice="N1">
                    <span class="level-choice-main" data-zh="专家" data-ja="上級">专家</span>
                    <span class="level-choice-sub">JLPT N1+</span>
                </button>
            </div>
        </div>
    </div>

    <button id="locate-btn" class="map-control-btn" type="button" title="回到当前位置" aria-label="回到当前位置" data-zh-title="回到当前位置" data-ja-title="現在地へ戻る" data-zh-label="回到当前位置" data-ja-label="現在地へ戻る">
        <span class="locate-icon" aria-hidden="true"></span>
        <span class="locate-label" data-zh="当前位置" data-ja="現在地">当前位置</span>
    </button>

    <div id="player-progress-panel" class="player-progress-panel" aria-live="polite">
        <div class="player-progress-top">
            <span id="player-level-label">Lv.1</span>
            <span id="player-exp-label" class="player-exp-label">EXP 0/50</span>
            <span id="player-coins-label">0 金币</span>
        </div>
        <div class="player-exp-bar" aria-hidden="true">
            <div id="player-exp-fill"></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="ui-toggle" title="收起/展开" data-zh-title="收起/展开" data-ja-title="折りたたみ/展開">
            <button id="ui-toggle-btn">▲</button>
        </div>
        <button id="lang-toggle-btn" onclick="toggleLanguage()" type="button">JP</button>

        <h2 data-zh="系统信息" data-ja="システム情報">系统信息</h2>
        <p id="status-text" data-zh="正在获取 GPS 定位..." data-ja="GPS位置情報を取得中...">正在获取 GPS 定位...</p>
        
        <select id="level-selector">
            <option value="N5" data-zh="👶 新手 (JLPT N5-N4)" data-ja="👶 初心者 (JLPT N5-N4)">👶 新手 (JLPT N5-N4)</option>
            <option value="N3" data-zh="🚶 进阶 (JLPT N3-N2)" data-ja="🚶 中級 (JLPT N3-N2)">🚶 进阶 (JLPT N3-N2)</option>
            <option value="N1" data-zh="🥷 专家 (JLPT N1+)" data-ja="🥷 上級 (JLPT N1+)">🥷 专家 (JLPT N1+)</option>
        </select>
        <div id="difficulty-hint" data-zh="当前难度：N5 - 新手" data-ja="現在の難易度：N5 - 初心者">当前难度：N5 - 新手</div>
        <button id="clear-cache-btn" data-zh="🗑️ 重置进度" data-ja="🗑️ 進行状況をリセット">🗑️ 重置进度</button>
    </div>

    <button id="bag-btn">
        🎒
        <span id="bag-badge">0</span> </button>

    <div id="inventory-layer">
        <div class="inv-header">
            <h3 data-zh="地点词汇卡" data-ja="場所語彙カード">地点词汇卡</h3>
            <button id="close-bag-btn">✖</button>
        </div>
        <div id="word-list"></div>
    </div>
    <div id="quest-layer" class="hidden">
        <div class="quest-panel">
            <div class="quest-header">
                <span class="location-tag" data-zh="📍 地点任务" data-ja="📍 地点タスク">📍 地点任务</span>
                <button id="btn-close-quest">✖</button>
            </div>

            <div class="quest-content">
                <h3 data-zh="文型语义缺失！" data-ja="文型セマンティクス欠落！">文型语义缺失！</h3>
                <div class="repair-reward-chip" id="quest-repair-points" data-zh="修复值 +1" data-ja="修復値 +1">修复值 +1</div>
                <div class="sentence-preview">
                    <span class="slot-box" id="quest-slot">?</span>
                    <span class="fixed-text">を たべる</span>
                </div>
            </div>

            <button id="btn-start-scan" data-zh="带着文型去拍照" data-ja="文型を持って撮影">带着文型去拍照</button>
        </div>
    </div>

    <div id="camera-layer" style="display: none;">
        <video id="camera-feed" autoplay playsinline></video>
        <div id="ai-scanning-overlay" class="hidden">
            <div class="simple-spinner"></div>
            <div class="simple-scanning-text" data-zh="解析中..." data-ja="解析中...">解析中...</div>
        </div>

        <div class="camera-controls">
            <button id="capture-btn" data-zh="提取属性 (Capture)" data-ja="Capture">提取属性 (Capture)</button>
            <button id="close-camera-btn" data-zh="关闭" data-ja="閉じる">关闭</button>
        </div>
    </div>

    <div id="word-card-layer" class="hidden">
        <div class="loot-card">
            <div class="loot-header" data-zh="✨ 文型词汇卡完成 ✨" data-ja="✨ 文型語彙カード完成 ✨">✨ 文型词汇卡完成 ✨</div>
            <div id="loot-word-main" class="loot-word"></div>
            
            <div class="loot-example-box">
                <div class="ex-label" data-zh="💡 例句" data-ja="💡 例文">💡 例句</div>
                <div id="loot-example-text" class="ex-text"></div>
                <div id="loot-example-zh" class="ex-zh"></div>
            </div>

            <button id="btn-collect-word" class="loot-btn" data-zh="收录到地点词汇卡" data-ja="場所語彙カードに保存">收录到地点词汇卡</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="ui.js?v=grammar-63"></script>
    <script src="quests.js?v=grammar-51"></script>
    <script src="inventory.js?v=grammar-63"></script>
    <script src="i18n.js?v=grammar-61"></script>
    <script src="vision.js?v=grammar-64"></script>
    <script src="map.js?v=grammar-64"></script>
    <script src="app.js?v=grammar-54"></script>
</body>
</html>
