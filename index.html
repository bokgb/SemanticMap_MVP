<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Semantic Map LBS Prototype</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>

    <div id="ui-layer">
        <h2>系统信息</h2>
        <p id="status-text">正在获取 GPS 定位...</p>
        
        <!-- 【新增】：难度选择下拉菜单 -->
        <select id="level-selector" style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 8px; font-weight: bold; background: #fff8e1; border: 2px solid #ff9800; color: #ff9800;">
            <option value="N5">👶 新手难度 (JLPT N5-N4)</option>
            <option value="N3">🚶 进阶难度 (JLPT N3-N2)</option>
            <option value="N1">🥷 专家难度 (JLPT N1+ / 原生)</option>
        </select>
        <div id="difficulty-hint">当前难度：N5 - 新手</div>
        <button id="scan-btn">打开取景器 (Scan)</button>
    </div>

    <button id="bag-btn">
        🎒 
        <span id="bag-badge">0</span> </button>

    <div id="inventory-layer">
        <div class="inv-header">
            <h3>已提取的词汇</h3>
            <button id="close-bag-btn">✖</button>
        </div>
        <div id="word-list"></div>
    </div>
    
    <div id="combo-layer" class="hidden">
        <div class="combo-panel">
            <h3>🧩 修复现实语义</h3>
            <p id="task-desc">区域异常：此公园需要【Nature】相关的词汇组合来净化！</p>
            <p class="task-rule">要求：[形容词] + [名词] + を + [动词]</p>

            <div class="slots-container">
                <div class="slot empty" id="slot-adj" data-type="形容词">形容词</div>
                <div class="slot empty" id="slot-noun" data-type="名词">名词</div>
                <div class="slot-text">を</div>
                <div class="slot empty" id="slot-verb" data-type="动词">动词</div>
            </div>

            <h4>你的词汇库：</h4>
            <div id="combo-word-list"></div>

            <div class="combo-actions">
                <button id="btn-submit-combo" disabled>执行 Combo!</button>
                <button id="btn-close-combo">撤退</button>
            </div>
        </div>
    </div>
    
    <div id="quest-layer" class="hidden">
    <div class="quest-panel">
        <div class="quest-header">
            <span class="location-tag">📍 Lawson 便利店</span>
            <button id="btn-close-quest">✖</button>
        </div>
        
        <div class="quest-content">
            <h3>环境语义缺失！</h3>
            <p>请通过拍照补充下述句子的空缺部分：</p>
            
            <div class="sentence-preview">
                <span class="slot-box" id="quest-slot">?</span>
                <span class="fixed-text">を たべる</span>
            </div>
        </div>

            <button id="btn-start-scan">带着任务去拍照</button>
        </div>
    </div>

    <div id="camera-layer" style="display: none;">
        <video id="camera-feed" autoplay playsinline></video>
        
    <!-- 在 <div class="viewfinder-frame"></div> 后面加上 -->
    <div id="ai-scanning-overlay" class="hidden">
        <div class="simple-spinner"></div>
        <div class="simple-scanning-text">解析中...</div>
    </div>
        
        <div class="camera-controls">
            <button id="capture-btn">提取属性 (Capture)</button>
            <button id="close-camera-btn">关闭</button>
        </div>
    </div>

    <div id="word-card-layer" class="hidden">
        <div class="loot-card">
            <div class="loot-header">✨ 发现新词汇 ✨</div>
            <div id="loot-word-main" class="loot-word"></div>
            
            <div class="loot-example-box">
                <div class="ex-label">💡 例句</div>
                <div id="loot-example-text" class="ex-text"></div>
                <div id="loot-example-zh" class="ex-zh"></div>
            </div>

            <button id="btn-collect-word" class="loot-btn">收下并存入背包</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
